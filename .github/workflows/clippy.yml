name: Clippy
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchains:
    name: Determine toolchains
    runs-on: ubuntu-24.04
    outputs:
      toolchains: ${{ steps.toolchains.outputs.toolchains }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: toolchains
        uses: mozilla/actions/toolchains@27cbe8fb5d338c2861b787e5de10410559065db1 # v1.1.3

  clippy:
    name: cargo clippy
    needs: toolchains
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        rust-toolchain: ${{ fromJSON(needs.toolchains.outputs.toolchains) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mozilla/actions/rust@27cbe8fb5d338c2861b787e5de10410559065db1 # v1.1.3
        with:
          version: ${{ matrix.rust-toolchain }}
          components: clippy
          tools: cargo-hack
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: nss-version
        uses: ./.github/actions/minimum-version
        with:
          directory: .
      - uses: mozilla/actions/nss@27cbe8fb5d338c2861b787e5de10410559065db1 # v1.1.3
        with:
          minimum-version: ${{ steps.nss-version.outputs.minimum }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Use cargo-hack to run clippy on each crate individually with its
      # respective default features only. Can reveal warnings otherwise
      # hidden given that a plain cargo clippy combines all features of the
      # workspace. See e.g. https://github.com/mozilla/neqo/pull/1695.
      - run: cargo hack clippy --feature-powerset --no-dev-deps --exclude-features gecko -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--deny rustdoc::broken_intra_doc_links --deny warnings"

      # Capture clippy diagnostics as JSON so the Clippy PR review workflow
      # can post them as inline review comments (with suggestion blocks for
      # MachineApplicable fixes). Re-runs clippy because the prior steps use
      # human-readable output and `-D warnings`; the compile cache makes the
      # second invocation cheap. Restricted to one matrix slot to avoid
      # duplicate uploads.
      - name: Capture clippy diagnostics for PR review
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu-24.04' &&
          matrix.rust-toolchain == 'stable'
        run: |
          mkdir -p clippy-pr-review
          cargo clippy --locked --workspace --all-targets --message-format=json \
            > clippy-pr-review/clippy.json || true
          echo "${PR_NUMBER}" > clippy-pr-review/pr-number
          echo "${GITHUB_WORKSPACE}" > clippy-pr-review/workspace-root
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload clippy PR review artifact
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu-24.04' &&
          matrix.rust-toolchain == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-pr-review
          path: clippy-pr-review/
          if-no-files-found: ignore
